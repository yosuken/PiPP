[package]
name = "pipp_util"
version = "0.4.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "Utilities for PiPP. First subcommand: import per-refpkg TSV outputs into DuckDB."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
duckdb = { version = "1", features = ["bundled"] }
flate2 = "1"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
